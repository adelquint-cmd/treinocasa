const MOB=['catcow','m9090','flexor','ponte','birddog'],COOL=['crianca','fig4','joelhos'];
const WK={
A:{n:'Força A',sub:'Pernas, peito, costas, ombros',col:'var(--cA)',main:['goblet','supino','remada','press'],core:['prancha','deadbug'],coreLab:'Abdominais',cardio:1},
B:{n:'Força B',sub:'Posterior, costas, peito',col:'var(--cB)',main:['rdl','puxada','afundos','flexoes'],core:['pranchalat','pallof'],coreLab:'Abdominais',cardio:1},
C:{n:'Joelho',sub:'Reforço com carga',col:'var(--cC)',main:['bulgaro','extensao','curl','stepup','stepdown','rdl1','wallsit','gemeos'],core:['passos','concha'],coreLab:'Glúteos',cardio:0}};
const ROT=['A','C','B','C'];
function items(wk){const W=WK[wk],L=[['aquec','Aquecimento']];MOB.forEach(i=>L.push([i,'Mobilidade']));W.main.forEach(i=>L.push([i,'Força']));W.core.forEach(i=>L.push([i,W.coreLab]));if(W.cardio)L.push(['cardio','Cardio']);COOL.forEach(i=>L.push([i,'Alongar']));return L}

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let data=load('tc_data',null);
if(!data||typeof data!=='object')data={};
data.pos=Number.isInteger(data.pos)?data.pos:0;data.hist=Array.isArray(data.hist)?data.hist:[];data.w=data.w&&typeof data.w==='object'?data.w:{};data.theme=data.theme==='light'?'light':'dark';
let sess=load('tc_sess',null);if(sess&&(!WK[sess.wk]||typeof sess.i!=='number'))sess=null;
let scr=sess?'ex':'home',showCue=true,impErr='';
document.documentElement.dataset.theme=data.theme;
function saveAll(){store('tc_data',data);store('tc_sess',sess)}

const ico={
back:'<path d="M15 6l-6 6 6 6"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',prev:'<path d="M15 6l-6 6 6 6"/>',next:'<path d="M9 6l6 6-6 6"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
data:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const I=(k)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ico[k]}</svg>`;
const CK='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';

function ln(p,w,c){return `<path d="M${p.map(q=>q.join(',')).join(' L')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`}
function limb(b,p,w1,w2,c){return ln([b,p[0]],w1,c)+ln([p[0],p[1]],w2,c)}
function pose(o,gh){
 const a2=o.a2||o.a1.map(([x,y])=>[x-3,y]),l2=o.l2||o.l1.map(([x,y])=>[x-5,y]);
 const C='var(--fig)',F=(o.fr||gh)?C:'var(--fig2)';let s=`<g${gh?' opacity=".2"':''}>`;
 if(o.cb)s+=`<line x1="${o.cb[0][0]}" y1="${o.cb[0][1]}" x2="${o.cb[1][0]}" y2="${o.cb[1][1]}" stroke="var(--prop)" stroke-width="1.5"/>`;
 s+=limb(o.n,a2,6,5,F)+limb(o.p,l2,8,7,F);
 s+=o.m?`<path d="M${o.n} Q${o.m} ${o.p}" fill="none" stroke="${C}" stroke-width="11" stroke-linecap="round"/>`:ln([o.n,o.p],11,C);
 s+=`<circle cx="${o.h[0]}" cy="${o.h[1]}" r="7.5" fill="${C}"/>`+limb(o.p,o.l1,8,7,C)+limb(o.n,o.a1,6,5,C);
 if(o.bd)s+=`<path d="M${o.bd[0]} L${o.bd[1]}" stroke="var(--amb)" stroke-width="3.5" stroke-linecap="round"/>`;
 const wt=[];if(o.w)wt.push(o.a1[1]);if(o.w==2)wt.push(a2[1]);
 s+=wt.map(([x,y])=>`<rect x="${x-8}" y="${y-3.5}" width="16" height="7" rx="2" fill="var(--amb)"/>`).join('');
 if(o.k&&!gh)s+=`<circle cx="${o.l1[0][0]}" cy="${o.l1[0][1]}" r="6.5" fill="none" stroke="var(--cC)" stroke-width="1.8"/>`;
 return s+'</g>'}
function figure(x){
 let v=`<svg class="fig" viewBox="0 -24 160 122" role="img" aria-label="${x.n}"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--amb)" stroke-width="2" stroke-linecap="round"/></marker></defs><line x1="2" y1="94" x2="158" y2="94" stroke="var(--line)" stroke-width="1"/>`;
 if(x.pr)v+=x.pr.map(d=>`<path d="${d}" fill="none" stroke="var(--prop)" stroke-width="3" stroke-linecap="round"/>`).join('');
 if(x.g)v+=pose(x.g,1);v+=pose(x.e,0);
 if(x.ar)v+=`<path d="${x.ar}" fill="none" stroke="var(--amb)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/>`;
 return v+'</svg>'}

const fmtW=v=>(Math.round(v*10)/10).toLocaleString('pt-PT');
function nextWk(){return ROT[data.pos%ROT.length]}
function weekCount(){const n=new Date(),d=(n.getDay()+6)%7,m=new Date(n.getFullYear(),n.getMonth(),n.getDate()-d);return data.hist.filter(h=>new Date(h.d)>=m).length}
function hint(id){const w=sess.w[id];if(!w)return false;let c=0;for(const h of data.hist){const e=h.ex&&h.ex[id];if(!e)continue;if(e.ok&&e.w===w){c++;if(c>=2)return true}else return false}return false}

let wl=null;
async function wake(on){try{if(on&&!wl&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&scr==='ex')wake(true)});
let ac=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.45].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.25)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}
let tEnd=0,tInt=null;
function startT(s){tEnd=Date.now()+s*1000;clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function stopT(){tEnd=0;clearInterval(tInt);tInt=null;tick()}
function tick(){const el=document.getElementById('tm');const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
 if(tEnd&&left<=0){tEnd=0;clearInterval(tInt);tInt=null;beep()}
 if(el){el.textContent=tEnd?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'';el.style.display=tEnd?'block':'none'}
 const b=document.getElementById('mainBtn');if(b)b.textContent=mainLbl()}

function render(){
 const app=document.getElementById('app'),bb=document.getElementById('bb');
 if(scr==='home'){app.innerHTML=rHome();bb.innerHTML='';wake(false)}
 else if(scr==='ex'){app.innerHTML=rEx();bb.innerHTML=rBar();wake(true);tick()}
 else if(scr==='list'){app.innerHTML=rList();bb.innerHTML=''}
 else if(scr==='end'){app.innerHTML=rEnd();bb.innerHTML='';wake(false)}
 else if(scr==='data'){app.innerHTML=rData();bb.innerHTML=''}
 window.scrollTo(0,0)}

function rHome(){
 const nx=nextWk(),W=WK[nx],L=items(nx),wc=weekCount(),C=2*Math.PI*30,frac=Math.min(wc/4,1);
 let h=`<div class="row" style="margin:4px 0 18px"><h1 class="d">Treino</h1><span class="sp"></span><button class="ib" onclick="tgTheme()" aria-label="Mudar tema">${I(data.theme==='dark'?'sun':'moon')}</button></div>`;
 h+=`<div class="card row" style="gap:16px;margin:0 0 14px"><svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="30" fill="none" stroke="var(--card2)" stroke-width="9"/><circle cx="38" cy="38" r="30" fill="none" stroke="var(--amb)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}" transform="rotate(-90 38 38)"/></svg><div><div class="d" style="font-size:34px;line-height:1">${wc} de 4</div><div class="muted">treinos esta semana</div></div></div>`;
 if(sess){const Ls=items(sess.wk);
  h+=`<div class="big" style="background:${WK[sess.wk].col};margin:0 0 14px"><div class="L d">${sess.wk}</div><div style="font-size:14px;opacity:.9">Treino a meio</div><div class="d" style="font-size:34px;line-height:1.05;margin:2px 0 4px">${WK[sess.wk].n}</div><div style="font-size:14px;opacity:.9;margin:0 0 14px">Exercício ${sess.i+1} de ${Ls.length}</div><button class="btn d" style="background:#fff;color:#18181B" onclick="cont()">Continuar</button><button style="margin:10px 0 0;color:#fff;font-size:14px;text-decoration:underline" onclick="discard()">Descartar este treino</button></div>`}
 else{
  h+=`<div class="big" style="background:${W.col};margin:0 0 12px"><div class="L d">${nx}</div><div style="font-size:14px;opacity:.9">Próximo treino</div><div class="d" style="font-size:40px;line-height:1.05;margin:2px 0 2px">${W.n}</div><div style="font-size:14px;opacity:.9;margin:0 0 16px">${W.sub}, ${L.length} exercícios</div><button class="btn d" style="background:#fff;color:#18181B" onclick="start('${nx}')">Começar</button></div>`;
  h+=`<div class="row" style="margin:0 0 22px">`+['A','B','C'].filter(k=>k!==nx).map(k=>`<button class="btn sec" style="flex:1;min-height:48px;font-size:15px" onclick="start('${k}')">Fazer <span class="d" style="color:${WK[k].col};font-size:20px">${k}</span> em vez disso</button>`).join('')+`</div>`}
 h+=`<div class="d" style="font-size:24px;margin:8px 0 8px">Histórico</div>`;
 if(!data.hist.length)h+=`<p class="muted">Os treinos que terminares aparecem aqui.</p>`;
 data.hist.slice(0,12).forEach(e=>{const d=new Date(e.d);
  h+=`<div class="li" style="cursor:default"><span class="d" style="font-size:30px;width:26px;color:${WK[e.wk]?WK[e.wk].col:'var(--tx2)'}">${e.wk}</span><div class="sp"><div>${WK[e.wk]?WK[e.wk].n:''}</div><div class="muted">${d.toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'})}, ${e.min||0} min</div></div><span class="muted">${e.done||0}/${e.tot||0}</span></div>`});
 h+=`<button class="btn sec" style="margin:16px 0 0;font-size:15px;min-height:48px" onclick="go2('data')">Guardar ou recuperar histórico</button>`;
 return h}

function cur(){const L=items(sess.wk);if(sess.i>=L.length)sess.i=L.length-1;const [id,ph]=L[sess.i];return {L,id,ph,x:E[id],done:sess.sets[id]||0}}
function rEx(){
 const {L,id,ph,x,done}=cur(),W=WK[sess.wk];
 let h=`<div class="row"><button class="ib" onclick="home()" aria-label="Voltar ao início">${I('back')}</button><span class="d" style="font-size:22px;color:${W.col}">Treino ${sess.wk}</span><span class="sp"></span><span class="muted">${sess.i+1} / ${L.length}</span><button class="ib" onclick="go2('list')" aria-label="Ver lista do treino">${I('list')}</button></div>`;
 h+=`<div class="bar"><i style="width:${((sess.i+(done>=x.s?1:0))/L.length)*100}%;background:${W.col}"></i></div>`;
 h+=`<span class="pill">${ph}</span><h1 class="d" style="font-size:40px;margin:10px 0 2px">${x.n}</h1><div class="muted" style="font-size:16px">${x.r}</div>`;
 h+=figure(x);
 h+=`<button class="muted" style="font-size:14px;padding:4px 0;text-decoration:underline" onclick="showCue=!showCue;render()">${showCue?'Esconder descrição':'Como fazer'}</button>`;
 if(showCue)h+=`<p style="margin:4px 0 0;font-size:15px">${x.c}</p>`;
 if(x.w){const w=sess.w[id]||0;
  h+=`<div class="wt"><button onclick="chW(-1)" aria-label="Menos 1 kg">−</button><div style="text-align:center"><input id="wIn" class="d" inputmode="decimal" aria-label="Peso em kg" value="${fmtW(w)}" onchange="setW(this.value)" onfocus="this.select()"><div class="muted">kg</div></div><button onclick="chW(1)" aria-label="Mais 1 kg">+</button></div>`;
  if(hint(id))h+=`<div class="hint">Fizeste todas as séries com este peso nas últimas 2 sessões. Considera subir o peso.</div>`}
 if(x.s>1)h+=`<div class="dots">`+Array.from({length:x.s},(_,k)=>`<button class="dot d ${k<done?'on':''}" onclick="tapDot(${k})" aria-label="Série ${k+1}${k<done?', feita':''}">${k+1}</button>`).join('')+`</div>`;
 return h}
function mainLbl(){if(!sess||scr!=='ex')return'';const {L,x,done}=cur();
 if(done<x.s&&tEnd)return'Saltar descanso';
 if(done<x.s)return x.s>1?`Série ${done+1} feita`:'Feito';
 return sess.i>=L.length-1?'Terminar treino':'Seguinte'}
function rBar(){return `<div class="bbar"><div class="in"><div id="tm" class="tm d" style="display:none"></div><div class="row"><button class="ib" style="width:56px;height:56px" onclick="go(-1)" aria-label="Exercício anterior">${I('prev')}</button><button id="mainBtn" class="btn amb d" style="flex:1" onclick="act()">${mainLbl()}</button><button class="ib" style="width:56px;height:56px" onclick="go(1)" aria-label="Exercício seguinte">${I('next')}</button></div></div></div>`}

function rList(){const L=items(sess.wk);
 let h=`<div class="row" style="margin:0 0 14px"><h1 class="d" style="font-size:34px">Treino ${sess.wk}</h1><span class="sp"></span><button class="ib" onclick="go2('ex')" aria-label="Fechar lista">${I('x')}</button></div>`;
 let last='';
 L.forEach(([id,ph],k)=>{const x=E[id],ok=(sess.sets[id]||0)>=x.s;
  if(ph!==last){h+=`<div class="muted" style="margin:12px 0 6px">${ph}</div>`;last=ph}
  h+=`<button class="li ${k===sess.i?'cur':''}" onclick="jump(${k})"><span class="ck ${ok?'on':''}">${ok?CK:''}</span><span class="sp">${x.n}</span><span class="muted">${x.w&&sess.w[id]?fmtW(sess.w[id])+' kg':''}</span></button>`});
 return h}

function rEnd(){const L=items(sess.wk),done=L.filter(([id])=>(sess.sets[id]||0)>=E[id].s).length,min=Math.round((Date.now()-sess.t0)/60000);
 return `<div style="padding:30px 0 0"><div class="d" style="font-size:20px;color:${WK[sess.wk].col}">Treino ${sess.wk}</div><h1 class="d" style="font-size:56px;margin:4px 0 18px">Concluído</h1>
 <div class="row" style="margin:0 0 22px"><div class="card sp"><div class="d" style="font-size:40px;line-height:1">${done}/${L.length}</div><div class="muted">exercícios feitos</div></div><div class="card sp"><div class="d" style="font-size:40px;line-height:1">${min}</div><div class="muted">minutos</div></div></div>
 <button class="btn amb d" onclick="finish()">Guardar treino</button><button class="btn sec" style="margin:10px 0 0;font-size:16px" onclick="go2('ex')">Voltar ao treino</button></div>`}

function rData(){
 return `<div class="row" style="margin:0 0 14px"><h1 class="d" style="font-size:34px">Histórico</h1><span class="sp"></span><button class="ib" onclick="go2('home')" aria-label="Fechar">${I('x')}</button></div>
 <p class="muted" style="margin:0 0 12px">O histórico fica guardado só neste telefone e neste browser. Para não o perderes, copia o texto abaixo de vez em quando e guarda-o numa nota.</p>
 <div class="d" style="font-size:22px;margin:0 0 6px">Exportar</div><textarea id="exp" readonly>${JSON.stringify(data).replace(/</g,'&lt;')}</textarea>
 <button class="btn amb d" style="margin:8px 0 22px" onclick="copyExp()" id="cpB">Copiar</button>
 <div class="d" style="font-size:22px;margin:0 0 6px">Importar</div><textarea id="imp" placeholder="Cola aqui o texto exportado" oninput="impErr='';document.getElementById('ie').textContent=''"></textarea><div id="ie" class="err">${impErr}</div>
 <button class="btn sec" style="margin:8px 0 0;font-size:16px" onclick="doImp()">Importar e substituir o histórico atual</button>`}

function start(wk){const w={};items(wk).forEach(([id])=>{if(E[id].w)w[id]=Number(data.w[id])||0});sess={wk,i:0,sets:{},w,t0:Date.now()};stopT();saveAll();scr='ex';render()}
function cont(){scr='ex';render()}
function discard(){if(confirm('Descartar o treino a meio? O que marcaste perde-se.')){sess=null;stopT();saveAll();render()}}
function home(){scr='home';saveAll();render()}
function go2(s){scr=s;render()}
function jump(k){sess.i=k;saveAll();scr='ex';render()}
function go(d){const L=items(sess.wk);const n=sess.i+d;if(n<0)return;if(n>=L.length){scr='end';render();return}sess.i=n;saveAll();render()}
function act(){const {id,x,done}=cur();
 if(done<x.s&&tEnd){stopT();return}
 if(done<x.s){sess.sets[id]=done+1;saveAll();if(x.rest)startT(x.rest);render();return}
 go(1)}
function tapDot(k){const {id,done}=cur();sess.sets[id]=k<done?k:k+1;saveAll();render()}
function chW(d){const {id}=cur();sess.w[id]=Math.max(0,Math.round(((sess.w[id]||0)+d)*10)/10);saveAll();const el=document.getElementById('wIn');if(el)el.value=fmtW(sess.w[id])}
function setW(v){const {id}=cur();const n=parseFloat(String(v).replace(',','.'));sess.w[id]=isFinite(n)&&n>=0?Math.round(n*10)/10:(sess.w[id]||0);saveAll();render()}
function finish(){const L=items(sess.wk);const ex={};let done=0;
 L.forEach(([id])=>{const x=E[id],ok=(sess.sets[id]||0)>=x.s;if(ok)done++;if(x.w){ex[id]={w:sess.w[id]||0,ok};if(sess.w[id]>0)data.w[id]=sess.w[id]}});
 data.hist.unshift({d:new Date().toISOString(),wk:sess.wk,min:Math.round((Date.now()-sess.t0)/60000),done,tot:L.length,ex});data.hist=data.hist.slice(0,300);
 let k=data.pos;for(let t=0;t<ROT.length;t++){if(ROT[(k+t)%ROT.length]===sess.wk){k=k+t;break}}data.pos=(k+1)%ROT.length;
 sess=null;stopT();saveAll();scr='home';render()}
function tgTheme(){data.theme=data.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=data.theme;saveAll();render()}
function copyExp(){const t=document.getElementById('exp'),b=document.getElementById('cpB');t.select();
 const ok=()=>{b.textContent='Copiado'};
 try{navigator.clipboard.writeText(t.value).then(ok,()=>{try{document.execCommand('copy');ok()}catch(e){b.textContent='Seleciona e copia à mão'}})}catch(e){try{document.execCommand('copy');ok()}catch(e2){b.textContent='Seleciona e copia à mão'}}}
function doImp(){const raw=document.getElementById('imp').value.trim();const ie=document.getElementById('ie');
 if(!raw){ie.textContent='Cola primeiro o texto exportado.';return}
 let o;try{o=JSON.parse(raw)}catch(e){ie.textContent='Este texto não é um histórico válido. Confirma que copiaste tudo.';return}
 if(!o||!Array.isArray(o.hist)){ie.textContent='Este texto não é um histórico válido. Confirma que copiaste tudo.';return}
 data.hist=o.hist.filter(h=>h&&WK[h.wk]&&!isNaN(new Date(h.d))).map(h=>({d:String(h.d),wk:h.wk,min:Number(h.min)||0,done:Number(h.done)||0,tot:Number(h.tot)||0,ex:h.ex&&typeof h.ex==='object'?h.ex:{}}));
 data.w={};if(o.w&&typeof o.w==='object')for(const k in o.w)if(E[k]){const n=Number(o.w[k]);if(isFinite(n)&&n>=0)data.w[k]=n}
 data.pos=Number.isInteger(o.pos)?((o.pos%ROT.length)+ROT.length)%ROT.length:0;
 saveAll();scr='home';render()}
render();
</script>
</body>
</html>
